# ============================================
# 生产环境 Docker Compose
# 镜像来源: ghcr.io/azure1033/ai-proj-1
# 部署命令: docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
# ============================================

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ai_chat
      MYSQL_USER: ai_chat_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"   # 仅本地访问
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  backend:
    image: ghcr.io/azure1033/ai-proj-1/backend:latest
    restart: unless-stopped
    environment:
      - USE_MYSQL=true
      - DATABASE_URL=mysql+aiomysql://ai_chat_user:${MYSQL_PASSWORD}@mysql:3306/ai_chat
    env_file:
      - .env                    # LLM_PROVIDER, ZHIPU_API_KEY 等由 .env 注入
    volumes:
      - chroma_data:/app/chroma_db
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    image: ghcr.io/azure1033/ai-proj-1/frontend:latest
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mysql_data:
  chroma_data:
  uploads_data:

networks:
  app-network:
    driver: bridge
