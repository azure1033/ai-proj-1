[project]
name = "ai-assistant"
version = "3.1.0"
description = "AI 智能问答助手 — LLM-powered chatbot with Tool-Calling Agent, RAG knowledge base, and SSE streaming"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-community>=0.3",
    "langchain-chroma>=0.1.2",
    "langchain-text-splitters>=0.3",
    "chromadb>=0.5",
    "requests>=2.31",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "tavily-python>=0.3",
    "ddgs>=6.0",
    "zhipuai>=2.0",
    "fastmcp>=3.0",
    "aiomysql>=0.2",
    "cryptography>=42.0",
    "pydantic>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
local-embedding = [
    "langchain-huggingface>=0.1",
    "sentence-transformers>=3.0",
]

[project.scripts]
ai-assistant = "uvicorn main:app --host 0.0.0.0 --port 8000"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
