server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;

    # Vue Router history 模式：所有非文件请求回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源：永久缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 不缓存，确保更新后用户立即获取新版本
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # API 反向代理到后端
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式响应支持
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
    }

    # 注意：后端路由没有 /api/ 前缀
    # 例如 /ask、/weather、/documents、/history、/sessions、/rag/status、/rag/settings
    # 这些也需要代理（或者前端用 /api/ask 等带前缀的方式）
    # 如果前端 API 调用使用 /api/ 前缀，则上面 /api/ 的 proxy_pass 已覆盖
    # 如果前端直接调用 /ask 等，需要额外配置：
    #
    # location /ask {}
    # location /weather {}
    # ...
}
